*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f4f7;--card:#fff;--pri:#0b63c5;--tx:#111827;--sub:#6b7280;--line:#e8ebef;
--green:#16a34a;--blue:#0b63c5;--orange:#ea580c;--red:#dc2626}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
.hd{background:linear-gradient(135deg,#0b63c5,#0284c7);color:#fff;
padding:calc(env(safe-area-inset-top) + 18px) 18px 20px}
.hd h1{font-size:19px;font-weight:700}
.hd .up{font-size:11.5px;opacity:.85;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 14px 4px}
.st{background:var(--card);border-radius:12px;padding:11px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.st b{display:block;font-size:20px;font-weight:700;line-height:1.15}
.st span{font-size:10.5px;color:var(--sub);margin-top:3px;display:block}
.st.warn b{color:var(--orange)}
.tabs{display:flex;gap:8px;padding:12px 14px 6px;position:sticky;top:0;z-index:20}
.tab{flex:1;background:var(--card);border-radius:11px;padding:9px 0;text-align:center;
font-size:13.5px;font-weight:600;color:var(--sub);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab.on{background:var(--pri);color:#fff}
.tab .nb{display:inline-block;min-width:15px;margin-left:4px;padding:0 4px;border-radius:8px;
background:var(--red);color:#fff;font-size:10.5px;line-height:15px;vertical-align:2px}
.tab.on .nb{background:#fff;color:var(--pri)}
.chips{display:flex;gap:7px;padding:6px 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
font-size:12px;color:var(--sub);white-space:nowrap;flex-shrink:0}
.chip.on{background:#e8f1fc;border-color:var(--pri);color:var(--pri);font-weight:600}
.grp{margin:0 14px 12px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.gh{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;
font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.gh .cnt{font-size:11.5px;color:var(--sub);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid #f4f6f8}
.row:last-child{border-bottom:none}
.rl{flex:1;min-width:0}
.rl .n{font-size:13.5px;line-height:1.35;word-break:break-word}
.rl .m{font-size:11px;color:var(--sub);margin-top:3px}
.rl .m .soon{color:var(--orange);font-weight:600}
.tag{font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
.t-graded{background:#e7f7ed;color:var(--green)}
.t-pending{background:#e8f1fc;color:var(--blue)}
.t-todo{background:#fff2e8;color:var(--orange)}
.t-overdue{background:#fdeaea;color:var(--red)}
.sc{font-size:14px;font-weight:700;flex-shrink:0;min-width:52px;text-align:right}
.sc.g{color:var(--green)}.sc.b{color:var(--blue)}.sc.o{color:var(--orange)}
.gd{font-size:11.5px;font-weight:700;flex-shrink:0;min-width:28px;text-align:center;
padding:2px 6px;border-radius:6px;background:#f0f3f7;color:var(--sub);letter-spacing:.2px}
.gd.a{background:#e7f7ed;color:var(--green)}
.gd.b{background:#e8f1fc;color:var(--blue)}
.gd.c{background:#fff2e8;color:var(--orange)}
.gd.d{background:#fdeaea;color:var(--red)}
.gscale{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:11.5px;line-height:1.7}
.cp{font-size:10.5px;color:var(--sub);margin-top:2px;opacity:.85}
.gscale b{display:inline-block;min-width:22px;color:var(--fg)}
.bar{height:5px;background:#eef1f4;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.sum{padding:9px 15px;background:#fafbfc;font-size:11.5px;color:var(--sub);border-top:1px solid var(--line)}
.sum b{color:var(--tx);font-size:13px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:44px 20px}
#alert{margin:12px 14px 0}
.al{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 14px}
.al-h{color:#dc2626;font-weight:700;font-size:13.5px;margin-bottom:6px}
.al-i{font-size:12.5px;padding:8px 0;border-top:1px solid #fee2e2;line-height:1.5}
.al-i b{font-size:12.5px}
.al-p{color:#b91c1c;margin-top:3px;font-size:12px}
.al-t{color:var(--sub);font-size:10.5px;margin-top:2px}
.al-x{margin-top:8px;background:#fff;border:1px solid #fca5a5;color:#b91c1c;
font-size:11.5px;padding:7px 13px;border-radius:9px;font-weight:600;cursor:pointer;
-webkit-tap-highlight-color:transparent}
.al-x:active{background:#fee2e2;transform:scale(.97)}
.al-r{margin-top:9px;text-align:center;font-size:11px;border-top:1px solid #fee2e2;padding-top:8px}
.al-r a{color:var(--sub);text-decoration:none}
.al-ok{color:var(--green);font-weight:700;font-size:13.5px;margin-bottom:2px}
.al-done{font-size:11.5px;color:var(--sub);margin-top:3px}
.rpt-ent{display:flex;gap:10px;margin:12px 14px 0}
.rb{flex:1;background:var(--pri);color:#fff;text-align:center;padding:12px 0;
border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;
box-shadow:0 2px 6px rgba(11,99,197,.25);-webkit-tap-highlight-color:transparent}
.rb:active{opacity:.82;transform:scale(.98)}
#rpt{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;
-webkit-overflow-scrolling:touch}
.rpt-hd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;display:flex;align-items:center;gap:10px;z-index:2}
.rpt-back{color:var(--pri);font-size:16px;font-weight:700;cursor:pointer;padding-right:4px}
.rpt-title{font-size:14.5px;font-weight:700}
.rpt-body{padding:12px 14px calc(34px + env(safe-area-inset-bottom))}
.rpt-body h1{font-size:17px;font-weight:700;margin:2px 0 10px}
.rpt-body h2{font-size:14px;font-weight:700;margin:16px 0 7px;color:var(--pri)}
.rpt-body p{font-size:12px;color:var(--sub);margin:3px 0}
.rpt-body blockquote{background:#fff8e6;border-left:3px solid #f59e0b;padding:8px 10px;
font-size:11.5px;color:#92400e;border-radius:0 8px 8px 0;margin:8px 0;line-height:1.5}
.rpt-body table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 14px;
background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rpt-body th{background:#f3f6f9;color:var(--sub);font-weight:600;text-align:left;

.rpt-body td{padding:8px;border-bottom:1px solid var(--line);word-break:break-word}
.hide{display:none}

.ft{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);

.ft b{color:var(--pri)}
.pad{padding-bottom:calc(72px + env(safe-area-inset-bottom))}

.lk{width:100%;max-width:330px;text-align:center;color:#fff}
.lk .ic{width:74px;height:74px;margin:0 auto 18px;background:rgba(255,255,255,.16);

.lk h2{font-size:18px;font-weight:700}
.lk p{font-size:12.5px;opacity:.85;margin-top:6px;line-height:1.6}
.lk input{width:100%;margin-top:20px;padding:14px 16px;border:none;border-radius:12px;

.lk button:active{opacity:.85}
.lk .err{font-size:12.5px;margin-top:11px;min-height:18px;color:#ffd7d7}

.ck{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:13px;font-size:12.5px;opacity:.9}
.ck input{width:16px;height:16px}

const $=s=>document.querySelector(s);
let D=null, tab='a', chip='all';
const STL={graded:'已出分',pending:'待批改',todo:'未提交',overdue:'已过期'};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));

async function derive(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.i,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},true,['decrypt']);
}

async function useKey(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.n)},key,b64(ENC.c));
  return new TextDecoder().decode(pt);
}

async function unlock(){
  const pw=$('#pw').value.trim();
  if(!pw){$('#err').textContent='请输入口令';return;}
  $('#err').textContent='首次解锁，正在生成密钥…';
  try{
    const key=await derive(pw);
    const txt=await useKey(key);
    if($('#rm').checked){
      localStorage.setItem('cw_key',toB64(await crypto.subtle.exportKey('raw',key)));
      localStorage.setItem('cw_pw',pw);
    }
    start(JSON.parse(txt));
  }catch(e){
    $('#err').textContent='口令不对，再试一次';
    $('#pw').value='';$('#pw').focus();
  }
}

function forget(){localStorage.removeItem('cw_key');localStorage.removeItem('cw_pw');location.reload();}

async function boot(){
  if(RAW){                                 // 明文模式：移除解锁层并直接渲染
    const l=document.getElementById('lock'); if(l) l.remove();
    start(RAW); return;
  }
  const k=localStorage.getItem('cw_key');
  if(k){
    try{
      const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
      start(JSON.parse(await useKey(key))); return;
    }catch(e){ localStorage.removeItem('cw_key'); }
  }
  const saved=localStorage.getItem('cw_pw');
  if(saved){
    try{
      const key=await derive(saved);
      const txt=await useKey(key);
      localStorage.setItem('cw_key',toB64(await crypto.subtle.exportKey('raw',key)));
      start(JSON.parse(txt)); return;
    }catch(e){ localStorage.removeItem('cw_pw'); }
  }
  $('#lock').classList.remove('hide');
}

function start(data){
  D=data;
  const lk=$('#lock'); if(lk) lk.classList.add('hide');   // 明文模式下已被移除，需判空
  $('#app').classList.remove('hide');
  $('#upd').textContent=D.updated;
  const s=D.stat;
  $('#stats').innerHTML=
   `<div class="st"><b>${s.courses}</b><span>课程</span></div>`+
   `<div class="st"><b>${s.total}</b><span>作业</span></div>`+
   `<div class="st"><b>${s.graded}</b><span>已出分</span></div>`+
   `<div class="st ${s.soon?'warn':''}"><b>${s.todo+s.pending}</b><span>待处理</span></div>`;
  bindTabs(); chips(); renderAlert(); initNew(); render();
}

function showRpt(k){
  const r=(D.reports||{})[k]||'';
  $('#rpt-title').textContent = (k==='list'?'作业清单':'成绩单');
  $('#rpt-body').innerHTML = r ? r : '<div class="empty">报告还没生成</div>';
  $('#rpt').classList.remove('hide');
  document.body.style.overflow='hidden';
  $('#rpt').scrollTop=0;
}
function hideRpt(){
  $('#rpt').classList.add('hide');
  document.body.style.overflow='';
}

const DISM='cw_dismissed_alerts';
function dismissedSet(){
  try{return new Set(JSON.parse(localStorage.getItem(DISM)||'[]'));}catch(e){return new Set();}
}
function dismissAlert(id){
  const s=dismissedSet(); s.add(id);
  try{localStorage.setItem(DISM,JSON.stringify([...s]));}catch(e){}
  renderAlert();
}
function restoreAlerts(){
  try{localStorage.removeItem(DISM);}catch(e){}
  renderAlert();
}

function renderAlert(){
  const all=D.issues||[];
  if(!all.length){$('#alert').classList.add('hide');return;}
  const dis=dismissedSet();
  const it=all.filter(x=>!dis.has(x.id));
  const hidden=all.length-it.length;
  $('#alert').classList.remove('hide');
  let h='<div class="al">';
  if(it.length){
    h+=`<div class="al-h">⚠ 有 ${it.length} 项作业待修正</div>`+
       it.map(x=>`<div class="al-i"><b>${x.course.split('|')[0]}</b> · ${x.assignment}
         <div class="al-p">${x.problem}</div>
         <div class="al-t">发现于 ${x.found_at||''}</div>
         <button class="al-x" data-id="${x.id}">✓ 已修正，消除此条</button></div>`).join('');
  }else{
    h+=`<div class="al-ok">✅ 全部已处理</div>
        <div class="al-done">之前的警示已被你手动消除</div>`;
  }
  if(hidden){
    h+=`<div class="al-r"><a href="javascript:void(0)" onclick="restoreAlerts()">恢复 ${hidden} 条已消除的警示</a></div>`;
  }
  h+='</div>';
  $('#alert').innerHTML=h;
  $('#alert').querySelectorAll('.al-x').forEach(b=>{
    b.onclick=()=>dismissAlert(b.dataset.id);
  });
}

function chips(){
  const s=D.stat;
  const arr=[['all',`全部 ${s.total}`],['todo',`待办 ${s.todo+s.pending}`],
             ['soon',`7天内 ${s.soon}`],['graded',`已出分 ${s.graded}`]];
  $('#chips').innerHTML=arr.map(([k,t])=>
    `<div class="chip ${chip===k?'on':''}" data-k="${k}">${t}</div>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{chip=c.dataset.k;chips();render();});
}

function pct(v){return v>=90?'g':(v>=80?'b':'o');}
function gcls(g){g=String(g||'').toUpperCase();
  if(g[0]==='A')return 'a'; if(g[0]==='B')return 'b'; if(g[0]==='C')return 'c';
  return 'd';}

function renderA(){
  let a=D.assignments.filter(x=>{
    if(chip==='all')return true;
    if(chip==='todo')return x.s!=='graded';
    if(chip==='soon')return x.dl!==null&&x.dl>=0&&x.dl<=7&&x.s!=='graded';
    if(chip==='graded')return x.s==='graded';
  });
  a.sort((x,y)=>{
    const f=z=>(z.s==='graded'?1:0);
    if(f(x)!==f(y))return f(x)-f(y);
    if(x.dl===null&&y.dl===null)return 0;
    if(x.dl===null)return 1; if(y.dl===null)return -1;
    return x.dl-y.dl;
  });
  if(!a.length){$('#list').innerHTML='<div class="empty">没有符合条件的作业 🎉</div>';return;}
  const g={}; a.forEach(x=>{(g[x.c]=g[x.c]||[]).push(x);});
  $('#list').innerHTML=Object.keys(g).sort().map(c=>{
    const rows=g[c].map(x=>{
      const soon=(x.dl!==null&&x.dl>=0&&x.dl<=7&&x.s!=='graded');
      const meta=[];
      if(x.d)meta.push(`截止 ${x.d}`);
      if(soon)meta.push(`<span class="soon">⏰剩 ${x.dl} 天</span>`);
      if(x.p)meta.push(`${x.p} 分`);
      const sc=x.sc!==null?`<div class="sc ${pct(x.p?x.sc/x.p*100:100)}">${x.sc}</div>`:'';
      return `<div class="row"><div class="rl"><div class="n">${x.n}</div>
        <div class="m">${meta.join(' · ')||'无截止日期'}</div></div>
        <span class="tag t-${x.s}">${STL[x.s]}</span>${sc}</div>`;
    }).join('');
    return `<div class="grp"><div class="gh"><span>${c.split('|')[0]}</span>
      <span class="cnt">${g[c].length} 项</span></div>${rows}</div>`;
  }).join('');
}

/* Coursework 门户的作业分数：只显示原始分，不折算百分比，不进 GPA */
function renderCW(){
  const cw=D.coursework;
  if(!cw||!cw.courses||!cw.courses.length) return '';
  return cw.courses.map(c=>{
    const rows=(c.items||[]).map(it=>`<div class="row"><div class="rl"><div class="n">${it.name}</div></div>
      <div class="sc">${it.score}<span style="font-size:11px;color:var(--sub);font-weight:400">/${it.max}</span></div></div>`).join('');
    return `<div class="grp"><div class="gh"><span>${c.name} 作业</span>
      <span class="cnt">${(c.items||[]).length} 项 · 门户原始分</span></div>${rows}
      <div style="padding:10px 15px;font-size:11px;color:var(--sub);line-height:1.7">
        Coursework 门户数据，刷新于 ${cw.updated||'未知'}；只记原始分数，不折算百分比。这些分按「作业」这项的考核占比计入 GPA（微积分：作业 20%）。</div></div>`;
  }).join('');
}

function renderG(){
  const ks=Object.keys(D.gByCourse).sort();
  const cw=renderCW();
  if(!ks.length&&!cw){$('#list').innerHTML='<div class="empty">暂无已公布成绩</div>';return;}
  $('#list').innerHTML=(ks.length?ks.map(c=>{
    const rows=D.gByCourse[c];
    let got=0,lost=0;
    rows.forEach(r=>{if(typeof r.sc==='number'){got+=r.sc;if(typeof r.pp==='number')lost+=r.pp;}});
    const p=lost?got/lost*100:0;
    const body=rows.map(r=>{
      const pv=r.pp?r.sc/r.pp*100:0;
      return `<div class="row"><div class="rl"><div class="n">${r.n}</div>
        <div class="m">${r.g||''}</div></div>
        <div class="sc ${pct(pv)}">${r.sc}<span style="font-size:11px;color:var(--sub);font-weight:400">/${r.pp??'-'}</span></div></div>`;
    }).join('');
    return `<div class="grp"><div class="gh"><span>${c.split('|')[0]}</span>
      <span class="cnt">${rows.length} 项</span></div>${body}
      <div class="sum">小计 <b>${got.toFixed(2).replace(/\.?0+$/,'')}</b> / ${lost}　${p.toFixed(1)}%
      <div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=90?'var(--green)':(p>=80?'var(--blue)':'var(--orange)')}"></i></div></div></div>`;
  }).join(''):'')+cw;
}

function renderP(){
  const G=D.gpa;
  if(!G||!G.courses||!G.courses.length){
    $('#list').innerHTML='<div class="empty">还没有已出分作业，无法估算 GPA</div>';return;
  }
  const o=G.overall, mx=G.scaleMax;
  const ratio=Math.max(0,Math.min(100,o.gpa/mx*100));
  const color=o.gpa>=mx*0.9?'var(--green)':(o.gpa>=mx*0.75?'var(--blue)':'var(--orange)');
  let h=`<div class="grp"><div class="gh"><span>GPA 估算</span>
    <span class="cnt">${G.weighted?'学分加权':'等权平均'} · ${o.counted}/${o.total} 门</span></div>
    <div style="padding:16px 12px;text-align:center">
      <div style="font-size:42px;font-weight:700;color:${color};line-height:1.05">${o.gpa.toFixed(2)}<span style="font-size:15px;color:var(--sub);font-weight:400"> / ${mx}</span></div>
      <div style="margin-top:8px;font-size:12px;color:var(--sub)">已出分作业平均得分率 <b style="color:var(--fg)">${o.pct}%</b></div>
      <div class="bar" style="margin-top:12px"><i style="width:${ratio}%;background:${color}"></i></div>
    </div></div>`;
  h+=`<div class="grp"><div class="gh"><span>预计成绩（还没出分，先按预估值计入上面的 GPA）</span><span class="cnt">${(D.predictions||[]).length} 项</span></div>`
    +(D.predictions||[]).map(p=>`<div class="row"><div class="rl"><div class="n">${p.course} · ${p.label}</div>
      <div class="m">预计 ${p.score} / ${p.max}${p.since?' · '+p.since+' 起生效':''}</div>
      <div class="cp" style="color:var(--sub)">${p.note||''}</div></div>
      <div class="sc" style="color:var(--orange)">预计</div></div>`).join('')+`</div>`;
  const AF=D.attendanceFull;
  if(AF&&AF.enabled){
    const ras=AF.raised||[], cre=AF.created||[];
    h+=`<div class="grp"><div class="gh"><span>出勤一律按满分</span><span class="cnt">${ras.length||cre.length?[ras.length?'上调 '+ras.length:'',cre.length?'补建 '+cre.length:''].filter(Boolean).join(' · '):'考勤分已是满分'}</span></div>`
      +(ras.length?ras.map(r=>`<div class="row"><div class="rl"><div class="n">${r.course} · ${r.item}</div>
            <div class="m">真实 ${r.orig} / ${r.pp} → 计入 GPA 用 ${r.pp} / ${r.pp}</div></div>
            <div class="sc" style="color:var(--orange)">满分</div></div>`).join(''):'')
      +(cre.length?cre.map(r=>`<div class="row"><div class="rl"><div class="n">${r.course} · ${r.item}</div>
            <div class="m">Canvas 没建考勤，按大纲的出勤项补一条 ${r.pp} / ${r.pp} 计入 GPA</div></div>
            <div class="sc" style="color:var(--orange)">补建</div></div>`).join(''):'')
      +(!ras.length&&!cre.length
        ?`<div class="cp" style="padding:10px 12px;color:var(--sub)">所有含「考勤 / 出勤 / Attendance」的项都按满分计入 GPA；大纲里有出勤项但 Canvas 没建考勤的课程，会自动补一条满分。成绩页签仍显示 Canvas 的真实分。</div>`:'' )
      +`</div>`;
  }
  h+=`<div class="grp"><div class="gh"><span>分课程明细</span><span class="cnt">${G.courses.length} 门</span></div>`
    +G.courses.map(c=>{
      const w=(G.weighted&&c.credits)?` · ${c.credits} 学分`:'';
      const g=c.grade||'-';
      const manual=!!c.manual;
      const mth=manual?'手动录入':((c.method==='weighted'||c.method==='canvas')?'构成明细':'已得分率');
      const meta=manual?`总评 ${c.pct}%${w} · ${mth}`
        :`${c.got} / ${c.lost} 分 · ${c.n} 项作业 · ${c.pct}%${w} · ${mth}`;
      const cp=manual
        ?(c.comps||[]).map(x=>`${x.label} ${x.w==null?'—':x.w+'%'}${x.rate==null?'':' → '+x.rate}`).join(' · ')
        :(c.comps||[]).map(x=>`${x.label} ${x.rate}%`).join(' · ');
      const cl=cp?`<div class="cp">${cp}</div>`:'';
      const nt=(manual&&c.note)?`<div class="cp" style="color:var(--sub)">${c.note}</div>`:'';
      return `<div class="row"><div class="rl"><div class="n">${c.name.split('|')[0]}</div>
        <div class="m">${meta}</div>${cl}${nt}</div>
        <div class="gd ${gcls(g)}">${g}</div>
        <div class="sc ${pct(c.pct)}">${c.gp.toFixed(1)}</div></div>`;
    }).join('')+`</div>`;
  h+=`<div class="grp"><div class="gh"><span>等级换算表（${mx} 制）</span>
    <span class="cnt">百分制 → 等级 → 绩点</span></div>
    <div class="gscale" style="padding:11px 14px;color:var(--sub)">`
    +G.table.map((t,i)=>{
      const gr=t.grade||'-';
      const hi=i===0?100:G.table[i-1].min-1;
      const rng=t.min>=hi?t.min+' 分':t.min+'–'+hi+' 分';
      return `<div><b class="gd ${gcls(gr)}">${gr}</b> ${rng} → ${Number(t.gp).toFixed(2)}</div>`;
    }).join('')+`</div></div>`;
  let ex='';
  if(G.excluded&&G.excluded.length){
    ex=G.excluded.map(e=>`<div style="margin-top:3px">· ${e.c.split('|')[0]} — ${e.n}（${e.sc} 分，成绩无效未计入）</div>`).join('');
    ex=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee;color:#c8452a">
      已排除的无效成绩：${ex}</div>`;
  }
  h+=`<div style="padding:12px;font-size:11px;color:var(--sub);line-height:1.75">
    ⚠️ ${G.note}。只统计<b>已出分</b>的作业，待批改的不计入，所以会随批改进度变化。${ex}</div>`;
  $('#list').innerHTML=h;
}

/* ---- 新增成绩（自上次访问以来） ------------------------------------------
   纯前端：以 localStorage 里的成绩指纹集合做基线，不依赖任何后端。
   基线在每次成功渲染时刷新，所以「上一次访问」= 上一个打开过本页的会话。 */
const SEEN_KEY='cw_seen_grades';
let NEW=[], SEEN=null;

function gradeKey(x){ return String(x.aid || (x.c+'|'+x.n+'|'+x.g)); }

function allGrades(){
  const out=[];
  Object.keys(D.gByCourse||{}).forEach(c=>{
    (D.gByCourse[c]||[]).forEach(r=>{
      out.push({c:c,n:r.n,sc:r.sc,pp:r.pp,g:r.g,aid:r.aid});
    });
  });
  return out;
}

function fmtVisit(iso){
  if(!iso) return '未知时间';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function initNew(){
  const cur=allGrades();
  const keys=cur.map(gradeKey);
  let prev=null;
  try{ prev=JSON.parse(localStorage.getItem(SEEN_KEY)||'null'); }catch(e){}
  if(!prev||!prev.keys){
    NEW=[]; SEEN={first:true,at:'',total:cur.length};
  }else{
    const seen=new Set(prev.keys);
    NEW=cur.filter(x=>!seen.has(gradeKey(x)));
    SEEN={first:false,at:prev.visit||'',dataAt:prev.dataAt||'',total:cur.length};
  }
  try{
    localStorage.setItem(SEEN_KEY,JSON.stringify({
      visit:new Date().toISOString(), dataAt:D.updated, keys:keys}));
  }catch(e){}
  const nb=document.getElementById('nb');
  if(nb){ nb.textContent=NEW.length; nb.style.display=NEW.length?'inline-block':'none'; }
}

function renderN(){
  if(!SEEN){ $('#list').innerHTML='<div class="empty">数据还没准备好</div>'; return; }
  if(SEEN.first){
    $('#list').innerHTML=`<div class="empty">首次使用：已记下当前 ${SEEN.total} 条已出分成绩作为基线<br>
      <span style="font-size:11px">下次打开这个页面，这里会列出之后新出的成绩</span></div>`;
    return;
  }
  if(!NEW.length){
    $('#list').innerHTML=`<div class="empty">自上次访问（${fmtVisit(SEEN.at)}）以来没有新增成绩<br>
      <span style="font-size:11px">页面数据更新于 ${D.updated}　·　每次打开本页会自动刷新基线</span></div>`;
    return;
  }
  const g={};
  NEW.forEach(x=>{(g[x.c]=g[x.c]||[]).push(x);});
  const list=Object.keys(g).sort((a,b)=>{
    const last=z=>Math.max(...g[z].map(x=>new Date(String(x.g||'1970-01-01')).getTime()||0));
    return last(b)-last(a);
  });
  let h=`<div class="grp"><div class="gh"><span>自上次访问以来新增 ${NEW.length} 条</span>
    <span class="cnt">上次访问 ${fmtVisit(SEEN.at)}</span></div>
    <div style="padding:10px 15px;font-size:11px;color:var(--sub);line-height:1.7">
      只统计<b>新出分</b>的作业；看过后基线自动前移，不会重复提醒。当前数据更新于 ${D.updated}。</div></div>`;
  h+=list.map(c=>{
    const rows=g[c].sort((x,y)=>String(y.g||'').localeCompare(String(x.g||''))).map(r=>{
      const pv=r.pp?r.sc/r.pp*100:0;
      return `<div class="row"><div class="rl"><div class="n">${r.n}</div>
        <div class="m">${r.g||''}</div></div>
        <div class="sc ${pct(pv)}">${r.sc}<span style="font-size:11px;color:var(--sub);font-weight:400">/${r.pp??'-'}</span></div></div>`;
    }).join('');
    return `<div class="grp"><div class="gh"><span>${c.split('|')[0]}</span>
      <span class="cnt">${g[c].length} 条新增</span></div>${rows}</div>`;
  }).join('');
  $('#list').innerHTML=h;
}

function render(){ tab==='a'?renderA():(tab==='g'?renderG():(tab==='p'?renderP():renderN())); }

function bindTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); tab=t.dataset.t;
    $('#chips').style.display=tab==='a'?'flex':'none';
    render();
  });
}

        var old = el.textContent;

        setTimeout(function () { el.textContent = old; }, 2600);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done, function () { fallback(txt, done); });
        } else { fallback(txt, done); }
      } catch (e) { fallback(txt, done); }
    };
    function fallback(txt, cb) {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); cb();
      } catch (e) {}

    document.body.insertBefore(el, document.body.firstChild);
  } catch (e) {}
})();

      try {
        document.documentElement.innerHTML =
          '<head><meta name="viewport" content="width=device-width,initial-scale=1">' +
          '<title>已休眠</title></head><body style="margin:0;min-height:100vh;display:flex;' +
          'align-items:center;justify-content:center;background:#0f1115;color:#9aa;font:' +
          '15px/1.7 -apple-system,system-ui,sans-serif;text-align:center">' +
          '<div><div style="font-size:15px;color:#cfd3da;margin-bottom:6px">此页面已随 App 退出而休眠</div>' +
          '<div style="font-size:12px;color:#6b7280;margin-bottom:16px">标签页可直接滑掉，不影响桌面 App 使用</div>' +
          '<button id="rw" style="padding:8px 18px;border:0;border-radius:8px;background:#3b82f6;' +
          'color:#fff;font-size:14px">重新打开</button></div></body>';
        var b = document.getElementById('rw');
        if (b) b.onclick = function () { location.reload(); };
      } catch (e) {}
    }, 350);
  }

  if (isStandalone()) {
    // 桌面 App 内：只写心跳，绝不关自己
    s(K_SEEN, '1');
    var beat = function () { s(K_HB, String(now())); };
    beat();
    setInterval(beat, HB_TICK);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { beat(); s(K_EXIT, String(now())); }
    });
    return;
  }

  // 浏览器标签页：登记自己并定期检查
  function tabTime(e) { return (e && typeof e === 'object') ? (e.t || 0) : (e || 0); }
  function tabSeq(e) { return (e && typeof e === 'object') ? (e.s || 0) : 0; }

  function tick() {
    if (closed || interacted) return;
    var m = tabMap(), t = now(), keys = Object.keys(m), i;
    // 清掉心跳超期的条目（对应标签已关闭、或被浏览器冻结不再执行脚本）
    for (i = 0; i < keys.length; i++) { if (t - tabTime(m[keys[i]]) > TAB_TTL) delete m[keys[i]]; }
    m[myId] = { t: t, s: mySeq };
    s(K_TABS, JSON.stringify(m));

    // 机制1：App 曾出现过，且心跳/退出标记超时 → App 已退出，清理本标签
    if (g(K_SEEN) === '1') {
      var last = Math.max(parseInt(g(K_EXIT) || '0', 10), parseInt(g(K_HB) || '0', 10));
      if (last && (t - last) > APP_TIMEOUT) { shutdown(); return; }
    }

    // 机制2（兜底）：按打开顺序只保留最新 MAX_TABS 个，更早打开的自动退出，防止堆积
    var ids = Object.keys(m).sort(function (a, b) { return tabSeq(m[a]) - tabSeq(m[b]); });
    if (ids.length > MAX_TABS) {
      for (i = 0; i < ids.length - MAX_TABS; i++) {
        if (ids[i] === myId) { shutdown(); return; }
      }
    }
  }

  // 分配打开顺序号（递增，只分配一次）
  try {
    mySeq = (parseInt(g('canvas_seq') || '0', 10) || 0) + 1;
    s('canvas_seq', String(mySeq));
  } catch (e) { mySeq = 1; }

  var m0 = tabMap(); m0[myId] = { t: now(), s: mySeq }; s(K_TABS, JSON.stringify(m0));
  setInterval(tick, TICK);
  setTimeout(tick, 1500);   // 打开 1.5s 后先查一次：App 若早已退出，立即清理
  window.addEventListener('pagehide', function () {
    var m = tabMap(); delete m[myId]; s(K_TABS, JSON.stringify(m));
  });
})();
